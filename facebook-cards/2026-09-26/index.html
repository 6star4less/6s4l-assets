<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<title>Feature cards 2026-09-26</title>
<style>
:root{--navy:#1B2E6B;--blue:#4A78D4;--bg:#EAECF0;--line:#D5DCEA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--navy);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:18px 16px 60px}
header{max-width:900px;margin:0 auto 20px}
h1{font-size:22px;font-weight:800;letter-spacing:-.2px}
p.sub{color:#5a6280;font-size:14px;margin-top:6px}
main{max-width:900px;margin:0 auto;display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
figure{background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:0 2px 10px rgba(27,46,107,.06)}
img{display:block;width:100%;height:auto}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;font-size:13.5px;font-weight:700;border-top:1px solid var(--line)}
a.dl{flex:0 0 auto;text-decoration:none;font-size:12.5px;font-weight:800;
  color:var(--blue);border:1px solid var(--blue);border-radius:8px;padding:5px 11px}
a.dl:active{background:#EAF1FF}
footer{max-width:900px;margin:34px auto 0;font-size:12.5px;color:#7b849c}
</style></head><body>
